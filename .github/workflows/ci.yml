name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run stage
      - uses: actions/upload-artifact@v4
        with:
          name: suitescripts
          path: suitecloud/src/FileCabinet/SuiteScripts/netsuite-smb-starter/
