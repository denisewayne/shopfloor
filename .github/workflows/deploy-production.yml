name: Deploy Production

# Push a version tag (e.g. v1.2.0) to release to production.
# Configure required reviewers on the "production" GitHub Environment so a
# human must approve before this runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only
        type: boolean
        default: true

jobs:
  production:
    # Off until you connect a NetSuite account. To turn on: repo Settings >
    # Secrets and variables > Actions > Variables, add NETSUITE_DEPLOY = true.
    if: vars.NETSUITE_DEPLOY == 'true'
    uses: ./.github/workflows/deploy-netsuite.yml
    with:
      environment: production
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
