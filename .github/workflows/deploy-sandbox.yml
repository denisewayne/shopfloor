name: Deploy Sandbox

# Every merge to main updates the sandbox (staging) account.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only
        type: boolean
        default: false

jobs:
  sandbox:
    # Off until you connect a NetSuite account. To turn on: repo Settings >
    # Secrets and variables > Actions > Variables, add NETSUITE_DEPLOY = true.
    if: vars.NETSUITE_DEPLOY == 'true'
    uses: ./.github/workflows/deploy-netsuite.yml
    with:
      environment: sandbox
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
